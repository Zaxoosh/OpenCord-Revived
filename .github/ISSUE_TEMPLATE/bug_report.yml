name: Bug or crash report
description: Report a reproducible problem in OpenCord Revived.
labels: [bug]
title: "[Bug] "

body:
    - type: input
      id: versions
      attributes:
          label: Environment and versions
          description: Include your OS, Discord channel and version, and Revived version or commit.
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: Steps to reproduce
          description: Include any relevant plugins and settings and say whether the issue occurs with plugins disabled.
      validations:
          required: true
    - type: textarea
      id: behaviour
      attributes:
          label: Expected and actual behaviour
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Relevant error output
          description: Remove personal information, account tokens, and API keys before posting.
          render: text
